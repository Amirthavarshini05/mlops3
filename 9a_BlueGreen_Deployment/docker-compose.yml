services:
  blue:
    image: nginx:alpine
    volumes:
      - ./blue/index.html:/usr/share/nginx/html/index.html:ro
    ports:
      - "8081:80"

  green:
    image: nginx:alpine
    volumes:
      - ./green/index.html:/usr/share/nginx/html/index.html:ro
    ports:
      - "8082:80"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - blue
      - green
